[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-plugin-analyze-threats"
version = "0.1.0"
requires-python = ">=3.10"
description = "Review threats in a pull request, commit or repository."
dependencies = ["appsec-cli-core==0.1.0", "appsec-analyzer==0.1.0a0"]

[project.entry-points."appsec_cli.tools"]
"analyze-threats" = "appsec_plugin_analyze_threats.commands:analyze"

[tool.setuptools.packages.find]
where = ["src"]
