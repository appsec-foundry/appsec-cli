[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-plugin-security-score"
version = "0.1.0"
requires-python = ">=3.10"
description = "Score a repository or assess a change; no model calls."
dependencies = ["appsec-cli-core==0.1.0", "appsec-security-score==0.3.4"]

[project.entry-points."appsec_cli.tools"]
"security-score" = "appsec_plugin_security_score.commands:score"

[tool.setuptools.packages.find]
where = ["src"]

[tool.appsec-cli]
examples = [
  { run = "security-score .", what = "Score the current repository" },
  { run = "security-score https://github.com/OWNER/REPO", what = "Score a GitHub repository" },
  { run = "security-score https://gitlab.com/GROUP/PROJECT", what = "Score a GitLab repository" },
  { run = "security-score --commit HEAD", what = "How security-relevant was the last commit?" },
  { run = "security-score --staged", what = "Check staged changes before you commit" },
]

[tool.appsec-cli.source]
package = "appsec-security-score"
git = "https://github.com/appsec-foundry/appsec-tools.git"
commit = "bb7345ce8bf2eab7ed49a71ab9ac2ea255cfb2c3"
path = "security-score"
