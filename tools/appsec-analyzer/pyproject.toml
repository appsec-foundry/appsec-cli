[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-plugin-appsec-analyzer"
version = "0.1.0"
requires-python = ">=3.10"
description = "Inspect source repositories and export assessments."
dependencies = ["appsec-cli-core==0.1.0", "appsec-analyzer==0.1.0a0"]

[project.entry-points."appsec_cli.tools"]
"appsec-analyzer.repo-profile" = "appsec_plugin_appsec_analyzer.commands:profile"
"appsec-analyzer.export" = "appsec_plugin_appsec_analyzer.commands:export"

[tool.setuptools.packages.find]
where = ["src"]

[tool.appsec-cli.commands.repo-profile]
summary = "Repository size, languages and build manifests."
examples = [
  { run = "appsec-analyzer repo-profile .", what = "Inventory the current repository" },
]

[tool.appsec-cli.commands.export]
summary = "Export a saved assessment, for example as SARIF or HTML."
examples = [
  { run = "appsec-analyzer export --assessment ./assessment --output ./out --formats sarif", what = "Export a saved assessment as SARIF" },
  { run = "appsec-analyzer export --assessment ./assessment --output ./out --formats html", what = "Export it as HTML (needs Pandoc)" },
]

[tool.appsec-cli.source]
package = "appsec-analyzer"
git = "https://github.com/appsec-foundry/appsec-analyzer.git"
commit = "165425abccc7ca9b3dddb04c8f7a080293b0023e"
