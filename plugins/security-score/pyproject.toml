[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-plugin-security-score"
version = "0.1.0"
requires-python = ">=3.10"
description = "Score a repository or assess a change."
dependencies = ["appsec-cli-core==0.1.0", "appsec-security-score==0.3.3"]

[project.entry-points."appsec_cli.tools"]
"security-score" = "appsec_plugin_security_score.commands:score"

[tool.setuptools.packages.find]
where = ["src"]
