[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-cli"
version = "0.1.0"
requires-python = ">=3.10"
description = "AppSec team command suite."
dependencies = ["appsec-cli-core==0.1.0", "appsec-plugin-security-score==0.1.0", "appsec-plugin-analyze-threats==0.1.0", "appsec-plugin-appsec-analyzer==0.1.0", "appsec-plugin-appsec-verifier==0.1.0"]

[project.scripts]
appsec-cli = "appsec_cli.cli:main"

[project.entry-points."appsec_cli.bundle"]
security-score = "appsec_plugin_security_score"
analyze-threats = "appsec_plugin_analyze_threats"
appsec-analyzer = "appsec_plugin_appsec_analyzer"
appsec-verifier = "appsec_plugin_appsec_verifier"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/appsec-cli/skills/appsec-cli" = ["skills/appsec-cli/SKILL.md"]
"share/appsec-cli/skills/appsec-cli/agents" = ["skills/appsec-cli/agents/openai.yaml"]
