[build-system]
requires = ["setuptools>=77", "packaging>=24,<27", "tomli>=2.2.1,<3; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-cli"
version = "0.1.0"
requires-python = ">=3.10"
description = "Security tools from your AppSec team"
dynamic = ["dependencies", "entry-points", "scripts"]

[tool.setuptools]
packages = ["appsec_suite", "appsec_suite.tools"]
package-dir = {appsec_suite = "src/appsec_suite", "appsec_suite.tools" = "tools"}

[tool.setuptools.package-data]
"appsec_suite.tools" = ["*/tool.toml"]

[tool.setuptools.data-files]
"share/appsec-cli/skills/appsec-cli" = ["skills/appsec-cli/SKILL.md"]
"share/appsec-cli/skills/appsec-cli/agents" = ["skills/appsec-cli/agents/openai.yaml"]
