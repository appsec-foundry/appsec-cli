[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-cli-core"
version = "0.1.0"
requires-python = ">=3.10"
description = "Plugin API, discovery and terminal interface."
dependencies = ["packaging>=24,<27", "typer==0.16.0", "click==8.2.1", "pydantic==2.14.3", "tomli>=2.2.1,<3; python_version < '3.11'"]

[tool.setuptools.packages.find]
where = ["src"]
